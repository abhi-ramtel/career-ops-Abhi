# Fortune 500 companies with a documented employment-visa sponsorship history
# ============================================================================
#
# WHAT THIS IS
#   An INPUT LIST for the existing `discover-ats.mjs` resolver — not a second
#   company database. Nothing here is scanned directly. The flow is:
#
#       templates/companies/fortune500-sponsors.yml   (this file)
#                     |
#                     v
#       node discover-ats.mjs --in <this file> --summary     (preview)
#       node discover-ats.mjs --in <this file> --write       (append)
#                     |
#                     v
#       portals.yml  tracked_companies:                (the existing system)
#                     |
#                     v
#       scan.mjs -> existing filters -> existing ranking
#
#   discover-ats.mjs probes Greenhouse/Ashby/Lever/Workday, keeps only boards
#   that exist AND currently list >=1 job, dedupes against what portals.yml
#   already has, and carries the `fortune500` / `sponsorship` fields below
#   onto each written entry.
#
# HOW TO REFRESH
#   The core search engine never needs to change to update this list — edit
#   this file, re-run discover-ats.mjs, done. Refresh sponsorship evidence
#   from the primary sources:
#     - DOL OFLC LCA disclosure data (H-1B/H-1B1/E-3 filings, quarterly):
#       https://www.dol.gov/agencies/eta/foreign-labor/performance
#     - USCIS H-1B Employer Data Hub (approvals by employer/fiscal year):
#       https://www.uscis.gov/tools/reports-and-studies/h-1b-employer-data-hub
#   Then bump `last_verified` on the rows you checked.
#
# ⚠️  READ THIS BEFORE TRUSTING A ROW
#   `sponsorship` is COMPANY-LEVEL HISTORY. It is NOT a promise that any given
#   posting sponsors:
#
#       company historically sponsors H-1B  ≠  this job sponsors H-1B
#
#   Sponsorship varies by req, team, level, and year, and many of these
#   employers also post clearance-required or citizen-only roles. Every
#   posting is still gated by the per-job filters (`visa_filter`,
#   `eligibility-filter.mjs`) regardless of what this file says. The only
#   thing a row buys is RANKING PRIORITY.
#
#   `last_verified` is when the evidence was last reviewed for this file, and
#   these seed rows are hand-curated from the public sources above rather than
#   machine-generated. Treat an old date as "recheck", not as fact.
#
# WHAT RESOLVES TODAY (measured 2026-08-17, not estimated)
#   6 of 29 resolve to a live zero-token board — all Workday, all via the
#   `workday:` hints below, each verified against the live CXS API:
#     Salesforce · NVIDIA · HPE · Mastercard · PayPal · Target
#
#   The other 23 do NOT resolve, and that is expected rather than a defect:
#   Microsoft, Amazon, Alphabet, Apple and Meta run their own in-house portals,
#   which have no public Greenhouse/Ashby/Lever/Workday JSON API for the
#   scanner to read. discover-ats.mjs reports them as unresolved instead of
#   silently writing a broken entry.
#
#   To bring one in, either:
#     (a) add a verified `workday:` careers URL below and re-run discovery —
#         hints are only worth adding once you have loaded the board and seen
#         real jobs, since a wrong tenant produces a silent zero-job entry; or
#     (b) add it to portals.yml by hand with `scan_method: websearch`, which
#         routes it to the agent's Playwright/WebSearch path instead of the
#         zero-token one.
#
#   Their sponsorship evidence is still worth keeping here either way: it is
#   what the ranking pass reads, and it stays true regardless of which scan
#   path reaches the posting.
#
# SCHEMA (per entry)
#   name           required. Company name.
#   slug           optional. ATS slug hint if the derived one is wrong.
#   website        optional.
#   workday        optional. Careers URL or {tenant, site} for Workday hints.
#   fortune500     optional bool. Flag carried onto the portals.yml entry.
#   sponsorship:
#     status       likely | historical | unknown  (never "guaranteed")
#     visa_types   list, e.g. ["H-1B", "H-1B1", "E-3", "O-1", "green card"]
#     evidence     free text — where the history comes from
#     last_verified  YYYY-MM-DD

