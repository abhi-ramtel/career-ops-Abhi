name: Web CI

# CI for the experimental web UI (web/). Informative by design: it is NOT a
# required check for the core — a red here never blocks a core merge, and core
# changes never trigger it. The web/ tree versions and releases as its own
# release-please component.
on:
  pull_request:
    paths:
      - 'web/**'
  push:
    branches: [main]
    paths:
      - 'web/**'

permissions:
  contents: read

jobs:
  web:
    name: web typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # web/tests/lib/*.test.mjs import core modules from the repo root
      # (tracker-utils.mjs), and Node resolves a bare specifier like `js-yaml`
      # relative to the IMPORTING file — i.e. against the root node_modules,
      # not web/'s. Installing only web/ therefore fails those suites with
      # ERR_MODULE_NOT_FOUND even though web/package.json lists js-yaml.
      # `--ignore-scripts` skips the root Playwright browser download, which
      # nothing in this job needs.
      - name: Install root deps (web tests import core modules)
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
